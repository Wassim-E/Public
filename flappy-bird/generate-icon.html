<!DOCTYPE html>
<html>
<head>
    <title>Generate Icon</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        canvas { border: 1px solid #ccc; margin: 10px; }
        button { margin: 10px; padding: 10px; }
    </style>
</head>
<body>
    <h1>Generate Flappy Bird Icon</h1>
    <p>Copy the base64 data URLs below into icon-192.png and icon-512.png files</p>
    
    <canvas id="icon192" width="192" height="192"></canvas>
    <canvas id="icon512" width="512" height="512"></canvas>
    
    <div>
        <button onclick="generateIcons()">Generate Icons</button>
        <button onclick="copy192()">Copy 192x192</button>
        <button onclick="copy512()">Copy 512x512</button>
    </div>
    
    <textarea id="output192" style="width: 100%; height: 100px; margin-top: 20px;"></textarea>
    <textarea id="output512" style="width: 100%; height: 100px; margin-top: 10px;"></textarea>

    <script>
        function generateIcons() {
            // Generate 192x192 icon
            const canvas192 = document.getElementById('icon192');
            const ctx192 = canvas192.getContext('2d');
            
            // Background
            ctx192.fillStyle = '#4a90e2';
            ctx192.fillRect(0, 0, 192, 192);
            
            // Draw bird
            ctx192.fillStyle = '#FFD700';
            ctx192.beginPath();
            ctx192.arc(96, 96, 70, 0, Math.PI * 2);
            ctx192.fill();
            
            // Draw eye
            ctx192.fillStyle = 'black';
            ctx192.beginPath();
            ctx192.arc(120, 80, 10, 0, Math.PI * 2);
            ctx192.fill();
            
            // Draw beak
            ctx192.fillStyle = '#FF4500';
            ctx192.beginPath();
            ctx192.moveTo(150, 96);
            ctx192.lineTo(180, 80);
            ctx192.lineTo(180, 112);
            ctx192.closePath();
            ctx192.fill();
            
            // Generate 512x512 icon
            const canvas512 = document.getElementById('icon512');
            const ctx512 = canvas512.getContext('2d');
            
            // Background
            ctx512.fillStyle = '#4a90e2';
            ctx512.fillRect(0, 0, 512, 512);
            
            // Draw bird
            ctx512.fillStyle = '#FFD700';
            ctx512.beginPath();
            ctx512.arc(256, 256, 180, 0, Math.PI * 2);
            ctx512.fill();
            
            // Draw eye
            ctx512.fillStyle = 'black';
            ctx512.beginPath();
            ctx512.arc(320, 220, 25, 0, Math.PI * 2);
            ctx512.fill();
            
            // Draw beak
            ctx512.fillStyle = '#FF4500';
            ctx512.beginPath();
            ctx512.moveTo(400, 256);
            ctx512.lineTo(480, 220);
            ctx512.lineTo(480, 292);
            ctx512.closePath();
            ctx512.fill();
            
            // Get data URLs
            document.getElementById('output192').value = canvas192.toDataURL('image/png');
            document.getElementById('output512').value = canvas512.toDataURL('image/png');
        }
        
        function copy192() {
            const textarea = document.getElementById('output192');
            textarea.select();
            document.execCommand('copy');
            alert('192x192 icon copied!');
        }
        
        function copy512() {
            const textarea = document.getElementById('output512');
            textarea.select();
            document.execCommand('copy');
            alert('512x512 icon copied!');
        }
        
        // Generate on load
        window.onload = generateIcons;
    </script>
</body>
</html>
